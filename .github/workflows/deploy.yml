name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend - install & test
        working-directory: backend
        run: |
          npm install
          npm test --if-present

      - name: Admin panel - install, lint & build
        working-directory: admin-panel
        run: |
          npm install
          npm run lint --if-present
          npm run build --if-present

# Deploy jobs were removed (2026-06-21): the backend already auto-deploys via
# Railway's own native GitHub integration (confirmed working independently of
# this workflow), and the admin panel is deployed manually with `vercel --prod`
# since the Vercel project has no Git integration configured. Both deploy jobs
# here were failing on every push (missing/invalid RAILWAY_TOKEN/VERCEL_TOKEN
# secrets) and just generating noisy failure-email spam without actually
# deploying anything — this workflow now only runs lint/test as a CI check.
